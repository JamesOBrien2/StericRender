[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stericrender"
version = "1.1.1"
description = "Topographic steric maps and buried volume (%VBur) with publication-quality SVG output."
authors = [
  { name = "James O'Brien" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.22",
  "xyzrender",
]

[project.urls]
Homepage = "https://github.com/JamesOBrien2/StericRender"
Repository = "https://github.com/JamesOBrien2/StericRender"
DOI = "https://doi.org/10.5281/zenodo.21475425"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]
validation = [
  "morfeus-ml>=0.8.0",
]
dev = [
  "morfeus-ml>=0.8.0",
  "ruff>=0.15.12",
  "ty>=0.0.33",
  "pytest",
  "pytest-cov",
]

[project.scripts]
stericrender = "stericrender.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stericrender"]

[tool.ty.environment]
python = ".venv"

[dependency-groups]
dev = [
    "morfeus-ml>=0.8.0",
    "ruff>=0.15.12",
    "ty>=0.0.33",
    "pytest",
    "pytest-cov",
]
