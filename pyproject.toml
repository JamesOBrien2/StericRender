[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stericrender"
version = "0.1.0"
description = "Steric-map and buried-volume analysis with xyzrender-oriented visual output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.22",
  "pillow>=10",
  "xyzrender",
]

[project.optional-dependencies]
test = [
  "pytest",
]
validation = [
  "morfeus-ml",
]

[project.scripts]
stericrender = "stericrender.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
